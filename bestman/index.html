<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Your Photos | Aram & Ian Wedding 2026</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💒</text></svg>">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=calendar_add_on,map_pin_heart" />
    <link rel="stylesheet" href="/styles.css">

    <style>
        /* ── Skeleton shimmer ─────────────────────────────── */
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.2rem;
            max-width: 900px;
            margin: 2rem auto 0;
        }

        .skeleton-card {
            border-radius: 8px;
            overflow: hidden;
            background: #f0ece6;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }

        .skeleton-img {
            width: 100%;
            aspect-ratio: 4/3;
            background: linear-gradient(90deg, #ede8e0 25%, #d6cfc4 50%, #ede8e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite;
        }

        .skeleton-card:nth-child(2) .skeleton-img { aspect-ratio: 3/4; }
        .skeleton-card:nth-child(5) .skeleton-img { aspect-ratio: 1/1; }

        .skeleton-text {
            padding: 0.7rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .skeleton-line {
            height: 9px;
            border-radius: 4px;
            background: linear-gradient(90deg, #ede8e0 25%, #d6cfc4 50%, #ede8e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite;
        }
        .skeleton-line.short { width: 55%; }

        .loading-label {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            letter-spacing: 0.08em;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-transform: uppercase;
        }

        .dot-pulse span {
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: #2c7873;
            animation: dp 1.2s infinite;
        }
        .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
        .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dp {
            0%,80%,100% { opacity:0.2; transform:scale(0.8); }
            40%          { opacity:1;   transform:scale(1.1); }
        }

        /* ── Glitch overlay ───────────────────────────────── */
        #glitch-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            opacity: 0;
        }

        .glitch-bar {
            position: absolute;
            left: 0; right: 0;
            background: #2c7873;
            mix-blend-mode: difference;
        }

        /* ── Reveal screen ────────────────────────────────── */
        #reveal {
            position: fixed;
            inset: 0;
            background: #1a2a29;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            opacity: 0;
            pointer-events: none;
            text-align: center;
        }

        #reveal.active {
            opacity: 1;
            pointer-events: all;
            transition: opacity 0.8s ease;
        }

        .reveal-eyebrow {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #2c7873;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
        }

        .reveal-name {
            font-family: Georgia, 'Times New Roman', serif;
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 400;
            color: #fff;
            line-height: 1;
            margin: 0.2em 0 0.1em;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.7s ease 0.6s, transform 0.7s ease 0.6s;
            letter-spacing: 0.02em;
        }

        .reveal-line {
            font-family: Georgia, 'Times New Roman', serif;
            font-style: italic;
            color: #a0bfbd;
            opacity: 0;
            transform: translateY(12px);
        }

        .reveal-line.l1 {
            font-size: clamp(1.1rem, 3.5vw, 2rem);
            margin-bottom: 0.6em;
            transition: opacity 0.7s ease 0.9s, transform 0.7s ease 0.9s;
        }

        .reveal-line.l2 {
            font-size: clamp(1.5rem, 5vw, 3rem);
            color: #fff;
            margin-bottom: 2.5rem;
            transition: opacity 0.7s ease 1.1s, transform 0.7s ease 1.1s;
        }

        #reveal.active .reveal-eyebrow,
        #reveal.active .reveal-name,
        #reveal.active .reveal-line,
        #reveal.active .reveal-buttons {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-buttons {
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.6s ease 1.4s;
            position: relative;
        }

        .rbtn {
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            padding: 0.9rem 2.2rem;
            border-radius: 4px;
            font-family: inherit;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        #btn-yes {
            background: #2c7873;
            color: #fff;
            font-weight: 500;
        }

        #btn-yes:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(44,120,115,0.45);
        }

        #btn-no {
            background: transparent;
            color: #7a9e9c;
            border: 1px solid #3a5a58;
            position: absolute;
            right: -130px;
            top: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        /* ── Yes state ────────────────────────────────────── */
        #yes-message {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        #yes-message .big-emoji {
            font-size: 4rem;
            animation: pop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }

        #yes-message p {
            font-family: Georgia, serif;
            font-size: clamp(1.3rem, 4vw, 2rem);
            color: #fff;
            font-style: italic;
            max-width: 480px;
        }

        #yes-message .sub {
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #2c7873;
            font-style: normal;
        }

        @keyframes pop {
            0%   { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ── Confetti ─────────────────────────────────────── */
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 200;
            animation: floatUp 2s ease-out forwards;
        }

        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg);   opacity: 1; }
            100% { transform: translateY(-120vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Navigation (original) -->
    <nav>
        <ul>
            <li><a href="/#home">Home</a></li>
        </ul>
    </nav>

    <!-- Photos Section -->
    <section id="photos" style="margin-top: 80px;">
        <h2>Share Your Photos</h2>
        <div class="divider"></div>

        <div class="photo-upload-container">
            <div class="loading-label">
                <span>Fetching photos</span>
                <span class="dot-pulse"><span></span><span></span><span></span></span>
            </div>

            <div class="skeleton-grid">
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-text"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>
            </div>
        </div>
    </section>

    <!-- Footer (original) -->
    <footer>
        <p>We can't wait to celebrate with you!</p>
        <p style="margin-top: 0.5rem;">&hearts; Aram &amp; Ian &hearts;</p>
    </footer>

    <!-- Glitch overlay -->
    <div id="glitch-overlay"></div>

    <!-- Reveal screen -->
    <div id="reveal">
        <div id="question-content">
            <h2 class="reveal-name">Hey Mike.</h2>
            <p class="reveal-line l1">There are no photos here.<br>But there is a question.</p>
            <p class="reveal-line l2">Will you be my Best Man?</p>
            <div class="reveal-buttons">
                <button class="rbtn" id="btn-yes">Yes, obviously</button>
                <button class="rbtn" id="btn-no">No</button>
            </div>
        </div>

        <div id="yes-message">
            <div class="big-emoji">🎉</div>
            <p>Knew it.</p> 
            <p>There's a stag to plan.</p>
            <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExN3g2czE1bTFnODI5cGJ0bm4wZTR1MWJnNDc5eGRkMW54MnNlOGo0bSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/QtuuT23dF9KIU/giphy.gif" alt="STAAAAAAG">
        </div>
    </div>

    <script src="/script.js"></script>
    <script>
        const LOADING_MS = 1600;
        const GLITCH_MS  = 600;

        setTimeout(() => triggerGlitch().then(showReveal), LOADING_MS);

        function triggerGlitch() {
            return new Promise(resolve => {
                const overlay = document.getElementById('glitch-overlay');
                overlay.style.opacity = '1';

                for (let i = 0; i < 14; i++) {
                    const bar = document.createElement('div');
                    bar.className = 'glitch-bar';
                    bar.style.cssText = `
                        top:${Math.random()*100}%;
                        height:${Math.random()*7+2}%;
                        opacity:${Math.random()*0.8+0.2};
                    `;
                    overlay.appendChild(bar);
                }

                document.body.style.transition = 'background 0.04s';
                document.body.style.background = '#fff';
                setTimeout(() => { document.body.style.background = '#1a2a29'; }, 70);

                setTimeout(() => {
                    overlay.style.transition = 'opacity 0.2s';
                    overlay.style.opacity = '0';
                    resolve();
                }, GLITCH_MS);
            });
        }

        function showReveal() {
            document.getElementById('reveal').classList.add('active');
        }

        // No button runs away on hover, disappears after 3 attempts
        const btnNo = document.getElementById('btn-no');
        let attempts = 0;

        function runAway(e) {
            e.preventDefault();
            attempts++;
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const r  = btnNo.getBoundingClientRect();
            const cx = e.clientX || vw / 2;
            const cy = e.clientY || vh / 2;

            let nx, ny;
            do {
                nx = Math.random() * (vw - r.width);
                ny = Math.random() * (vh - r.height);
            } while (Math.abs(nx - cx) < 150 && Math.abs(ny - cy) < 100);

            btnNo.style.position = 'fixed';
            btnNo.style.left = nx + 'px';
            btnNo.style.top  = ny + 'px';
            btnNo.style.right = 'auto';

            if (attempts >= 3) {
                btnNo.style.opacity = '0';
                btnNo.style.pointerEvents = 'none';
            }
        }

        btnNo.addEventListener('mouseover', runAway);
        btnNo.addEventListener('touchstart', runAway, { passive: false });

        // Airhorn via Web Audio API
        function playAirhorn() {
            const soundEffect = new Audio('https://www.myinstants.com/media/sounds/dj-airhorn-sound-effect-kingbeatz_1.mp3');

            soundEffect.play();
        }

        // Confetti burst
        function launchParticles() {
            const colours = ['#2c7873','#a8d4d0','#ffffff','#c8e6e4','#5aab9b','#e8f5f4'];
            for (let i = 0; i < 80; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 10 + 5;
                p.style.cssText = `
                    width:${size}px; height:${size}px;
                    background:${colours[Math.floor(Math.random()*colours.length)]};
                    left:${Math.random()*100}vw;
                    bottom:0;
                    border-radius:${Math.random()>0.5?'50%':'2px'};
                    animation-duration:${Math.random()*1.5+1}s;
                    animation-delay:${Math.random()*0.4}s;
                `;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 3000);
            }
        }

        // Yes button
        document.getElementById('btn-yes').addEventListener('click', () => {
            playAirhorn();
            launchParticles();

            const qc = document.getElementById('question-content');
            const ym = document.getElementById('yes-message');
            qc.style.transition = 'opacity 0.3s';
            qc.style.opacity = '0';

            setTimeout(() => {
                qc.style.display = 'none';
                ym.style.display = 'flex';
                ym.style.opacity = '0';
                ym.style.transition = 'opacity 0.6s ease';
                setTimeout(() => ym.style.opacity = '1', 50);
            }, 350);
        });
    </script>
</body>
</html>
